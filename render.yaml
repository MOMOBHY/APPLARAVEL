# Blueprint Render : application Laravel (Docker, offre gratuite) reliée à la base PostgreSQL Supabase.
# Seul DB_PASSWORD est demandé à la création du Blueprint ; il n'est jamais stocké dans le dépôt.
services:
  - type: web
    name: gfp-plateforme
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Plateforme GFP
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-1-eu-central-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: gfp_app.wpvisftytcgvbutcigco
      - key: DB_PASSWORD
        sync: false
      - key: DB_SEARCH_PATH
        value: gfp
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
