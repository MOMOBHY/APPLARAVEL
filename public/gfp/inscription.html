<!doctype html>
<html lang="fr" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" href="assets/logo-republique-cote-ivoire.png" />
    <title>
      Créer un compte - Ministère de la Fonction Publique et de la Modernisation de l’Administration
    </title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GFP" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#047857" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      html {
        -webkit-text-size-adjust: 100%;
        height: -webkit-fill-available;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100dvh;
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
        -webkit-tap-highlight-color: transparent;
        position: relative;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url('assets/ministere_bg.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(5px);
        opacity: 0.15;
        z-index: 0;
        pointer-events: none;
      }
      main,
      section,
      div {
        position: relative;
        z-index: 1;
      }
      @media screen and (max-width: 768px) {
        input,
        select,
        textarea {
          font-size: 16px !important;
        }
      }
      button,
      input,
      a {
        touch-action: manipulation;
      }
    </style>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased min-h-full flex flex-col font-sans">
    <div class="h-2 w-full flex" style="position: relative; z-index: 10">
      <div class="h-full w-1/3 bg-orange-500"></div>
      <div class="h-full w-1/3 bg-white"></div>
      <div class="h-full w-1/3 bg-emerald-600"></div>
    </div>

    <main class="flex-1 flex items-center justify-center p-3 sm:p-4">
      <section
        class="max-w-lg w-full bg-white rounded-2xl border border-slate-200 shadow-xl p-5 sm:p-8"
      >
        <div class="text-center space-y-3 mb-6">
          <img
            src="assets/logo.png"
            alt="Armoiries de Côte d'Ivoire"
            class="h-16 w-auto object-contain mx-auto mb-1"
          />
          <p class="text-xs font-extrabold uppercase tracking-widest text-slate-500">
            République de Côte d'Ivoire
          </p>
          <h1 class="text-lg font-extrabold text-emerald-800 uppercase">Créer un compte</h1>
          <p class="text-xs text-slate-500">
            Choisissez votre rôle, puis connectez-vous avec votre matricule et votre mot de passe.
          </p>
          <div class="h-0.5 w-16 bg-emerald-700 mx-auto rounded-full"></div>
        </div>

        <form onsubmit="handleRegister(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="civilite" class="block text-xs font-bold text-slate-700 uppercase mb-1"
                >Civilité *</label
              >
              <select
                id="civilite"
                class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-emerald-600"
              >
                <option value="M.">M.</option>
                <option value="Mme">Mme</option>
              </select>
            </div>
            <div>
              <label for="matricule" class="block text-xs font-bold text-slate-700 uppercase mb-1"
                >Matricule *</label
              >
              <input
                id="matricule"
                type="text"
                required
                maxlength="30"
                autocomplete="username"
                placeholder="Ex. 000007K"
                class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-emerald-600 font-mono"
              />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="nom" class="block text-xs font-bold text-slate-700 uppercase mb-1"
                >Nom *</label
              >
              <input
                id="nom"
                type="text"
                required
                maxlength="100"
                autocomplete="family-name"
                class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-emerald-600"
              />
            </div>
            <div>
              <label for="prenom" class="block text-xs font-bold text-slate-700 uppercase mb-1"
                >Prénom *</label
              >
              <input
                id="prenom"
                type="text"
                required
                maxlength="150"
                autocomplete="given-name"
                class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-emerald-600"
              />
            </div>
          </div>
          <div>
            <label for="role" class="block text-xs font-bold text-slate-700 uppercase mb-1"
              >Rôle *</label
            >
            <select
              id="role"
              required
              class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-emerald-600 font-bold"
            >
              <option value="ROLE_AGENT">Agent Fonctionnaire</option>
              <option value="ROLE_CHEF_SERVICE">Gestionnaire RH</option>
              <option value="ROLE_CHEF_DE_SERVICE">Chef de Service</option>
              <option value="ROLE_SECRETAIRE">Secrétaire de Direction</option>
              <option value="ROLE_SOUS_DIRECTEUR">Sous-Directeur</option>
              <option value="ROLE_DIRECTEUR">Directeur</option>
              <option value="ROLE_DIRECTEUR_CABINET">Directeur de Cabinet</option>
              <option value="ROLE_DRH">DRH</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="password" class="block text-xs font-bold text-slate-700 uppercase mb-1"
                >Mot de passe *</label
              >
              <input
                id="password"
                type="password"
                required
                minlength="6"
                autocomplete="new-password"
                class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-emerald-600"
              />
            </div>
            <div>
              <label
                for="confirmation"
                class="block text-xs font-bold text-slate-700 uppercase mb-1"
                >Confirmation *</label
              >
              <input
                id="confirmation"
                type="password"
                required
                minlength="6"
                autocomplete="new-password"
                class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-emerald-600"
              />
            </div>
          </div>

          <p id="registerError" class="hidden text-xs text-red-600 font-bold text-center"></p>
          <button
            type="submit"
            class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-lg text-sm shadow-md transition"
          >
            Créer mon compte
          </button>
        </form>

        <a
          href="index.html"
          class="block text-center mt-6 text-xs font-bold text-slate-600 hover:text-slate-900"
        >
          Déjà inscrit ? Retour à la connexion
        </a>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script>
      /**
       * Traite le formulaire d'inscription : vérifie la confirmation du mot de passe, appelle l'API puis renvoie vers la connexion avec le matricule prérempli.
       */
      async function handleRegister(event) {
        event.preventDefault();
        const erreur = document.getElementById('registerError');
        const valeur = (id) => document.getElementById(id).value.trim();
        if (
          document.getElementById('password').value !==
          document.getElementById('confirmation').value
        ) {
          erreur.textContent = 'Les deux mots de passe ne correspondent pas.';
          erreur.classList.remove('hidden');
          return;
        }
        const payload = {
          civilite: valeur('civilite'),
          matricule: valeur('matricule'),
          nom: valeur('nom'),
          prenom: valeur('prenom'),
          role: valeur('role'),
          password: document.getElementById('password').value,
        };
        const res = await API.register(payload);
        if (res.status === 'success') {
          window.location.href =
            'index.html?inscrit=' + encodeURIComponent(payload.matricule.toUpperCase());
          return;
        }
        erreur.textContent = res.message || 'Impossible de créer le compte.';
        erreur.classList.remove('hidden');
      }
    </script>
  </body>
</html>
