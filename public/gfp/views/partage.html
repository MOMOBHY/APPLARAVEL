<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/logo-gfp.svg">
  <title>Partage entre structures - Ministère de la Fonction Publique et de la Modernisation de l’Administration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { position: relative; }
    body::before {
      content: ''; position: fixed; inset: 0; background-image: url('../assets/ministere_bg.png');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      filter: blur(5px); opacity: 0.15; z-index: 0; pointer-events: none;
    }
    header, main, nav, div { position: relative; z-index: 1; }
  </style>
  <link rel="stylesheet" href="../assets/theme.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-full flex flex-col font-sans">

  <div class="h-2 w-full flex" style="position:relative;z-index:10;">
    <div class="h-full w-1/3 bg-orange-500"></div><div class="h-full w-1/3 bg-white"></div><div class="h-full w-1/3 bg-emerald-600"></div>
  </div>

  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0" style="z-index:50;">
    <div id="gfp-entete" data-sous-titre="Partage entre structures" data-role="" data-base="../"></div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    <a id="retour" href="#" class="inline-block px-3 py-1.5 border border-slate-300 hover:bg-slate-100 rounded-lg text-xs font-bold text-slate-700 bg-white">← Retour à mon espace</a>

    <!-- PUBLIER (rôles habilités) -->
    <div id="blocPublier" class="hidden bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
      <div>
        <h2 class="text-base font-bold text-slate-900">Partager avec des structures</h2>
        <p class="text-xs text-slate-500">Les agents des structures choisies voient le partage et reçoivent une notification.</p>
      </div>
      <form id="formPartage" class="space-y-3">
        <input type="text" id="pTitre" required maxlength="200" placeholder="Titre *" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs">
        <textarea id="pMessage" rows="4" maxlength="5000" placeholder="Message (facultatif si un document est joint)" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs"></textarea>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Document (PDF, Word, Excel, image — 5 Mo max)</label>
          <input type="file" id="pFichier" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png" class="w-full text-xs">
        </div>
        <div class="border border-slate-200 rounded-lg p-3 space-y-2">
          <label class="flex items-center gap-2 text-xs font-bold text-emerald-800">
            <input type="checkbox" id="pToutes"> Toutes les structures du ministère
          </label>
          <div id="pStructures" class="grid grid-cols-1 sm:grid-cols-2 gap-1 max-h-56 overflow-y-auto text-xs text-slate-700"></div>
        </div>
        <div class="flex justify-end">
          <button type="submit" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold shadow">Partager</button>
        </div>
      </form>
    </div>

    <!-- REÇUS / PUBLIÉS -->
    <div class="space-y-3">
      <h2 class="text-base font-bold text-slate-900">Partages <span id="compteur" class="text-xs font-bold text-slate-500"></span></h2>
      <div id="liste" class="space-y-3"></div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    const user = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
    document.getElementById('retour').href = API.urlEspace(user.role);

    async function chargerStructures() {
      const res = await API.getStructures();
      const structures = (res.structures || []).slice().sort((a, b) => a.nom_structure.localeCompare(b.nom_structure, 'fr'));
      document.getElementById('pStructures').innerHTML = structures.map(s =>
        `<label class="flex items-start gap-2"><input type="checkbox" class="pStruct mt-0.5" value="${Number(s.id_structure)}"> <span>${escapeHtml(s.nom_structure)}</span></label>`).join('');
    }

    async function charger() {
      const res = await API.getPartages();
      if (res.status !== 'success') { document.getElementById('liste').innerHTML = '<p class="text-xs text-red-700">Chargement impossible.</p>'; return; }
      document.getElementById('blocPublier').classList.toggle('hidden', !res.peut_partager);
      document.getElementById('compteur').textContent = '(' + res.partages.length + ')';
      document.getElementById('liste').innerHTML = res.partages.map(p => `
        <article class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
          <div class="flex justify-between items-start gap-2">
            <h3 class="text-sm font-bold text-slate-900">${escapeHtml(p.titre)}</h3>
            <span class="text-[11px] text-slate-500 whitespace-nowrap">${escapeHtml(p.date)}</span>
          </div>
          ${p.message ? `<p class="text-xs text-slate-700 whitespace-pre-line">${escapeHtml(p.message)}</p>` : ''}
          <div class="flex flex-wrap items-center gap-2 text-[11px] text-slate-500">
            <span>Par <b class="text-slate-700">${escapeHtml(p.auteur || 'Ministère')}</b></span>
            <span class="px-2 py-0.5 rounded-full border font-bold ${p.toutes_structures ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-slate-100 text-slate-700 border-slate-300'}">
              ${p.toutes_structures ? 'Toutes les structures' : escapeHtml(p.structures.join(', '))}</span>
            ${p.piece_id ? `<button onclick="API.ouvrirPiece(${Number(p.piece_id)})" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-900 text-white rounded text-[10px] font-bold">Ouvrir : ${escapeHtml(p.piece)}</button>` : ''}
            ${p.supprimable ? `<button onclick="supprimer(${Number(p.id)})" class="ml-auto px-2 py-0.5 border border-red-300 text-red-700 hover:bg-red-50 rounded text-[10px] font-bold">Supprimer</button>` : ''}
          </div>
        </article>`).join('') || '<p class="text-xs text-slate-500 italic">Aucun partage pour le moment.</p>';
    }

    async function supprimer(id) {
      if (!confirm('Supprimer ce partage ?')) return;
      const res = await API.supprimerPartage(id);
      if (res.status === 'success') charger(); else alert('Suppression impossible : ' + (res.message || 'erreur'));
    }

    document.getElementById('pToutes').onchange = e => document.querySelectorAll('.pStruct').forEach(c => { c.disabled = e.target.checked; if (e.target.checked) c.checked = false; });
    document.getElementById('formPartage').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData();
      fd.append('titre', document.getElementById('pTitre').value.trim());
      fd.append('message', document.getElementById('pMessage').value.trim());
      const toutes = document.getElementById('pToutes').checked;
      fd.append('toutes_structures', toutes ? '1' : '0');
      if (!toutes) document.querySelectorAll('.pStruct:checked').forEach(c => fd.append('structure_ids[]', c.value));
      const fichier = document.getElementById('pFichier').files[0];
      if (fichier) fd.append('fichier', fichier);
      const res = await API.publierPartage(fd);
      if (res.status === 'success') {
        e.target.reset();
        document.querySelectorAll('.pStruct').forEach(c => c.disabled = false);
        alert('Partagé. ' + res.destinataires + ' agent(s) notifié(s).');
        charger();
      } else {
        const erreurs = res.errors ? Object.values(res.errors).flat().join(' ') : '';
        alert('Erreur : ' + (erreurs || res.message || 'Partage impossible'));
      }
    };

    chargerStructures();
    charger();
  </script>
</body>
</html>
