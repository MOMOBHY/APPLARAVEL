<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/logo-gfp.svg">
  <title>Notes de service - Ministère de la Fonction Publique et de la Modernisation de l’Administration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { position: relative; }
    body::before {
      content: ''; position: fixed; inset: 0; background-image: url('../assets/ministere_bg.png');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      filter: blur(5px); opacity: 0.15; z-index: 0; pointer-events: none;
    }
    header, main, nav, div { position: relative; z-index: 1; }
  </style>
  <link rel="stylesheet" href="../assets/theme.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-full flex flex-col font-sans">

  <div class="h-2 w-full flex" style="position:relative;z-index:10;">
    <div class="h-full w-1/3 bg-orange-500"></div><div class="h-full w-1/3 bg-white"></div><div class="h-full w-1/3 bg-emerald-600"></div>
  </div>

  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
    <div id="gfp-entete" data-sous-titre="Notes de service" data-role="" data-base="../"></div>
    <nav class="bg-slate-100 border-t border-slate-200 px-4 sm:px-6 lg:px-8">
      <div class="max-w-7xl mx-auto flex space-x-2 overflow-x-auto py-2">
        <button id="onglet" class="px-3 py-2 rounded-md text-xs font-bold bg-emerald-700 text-white whitespace-nowrap"></button>
      </div>
    </nav>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-5">
      <div class="border-b border-slate-200 pb-3">
        <h2 id="titre" class="text-base font-bold text-slate-900"></h2>
        <p id="description" class="text-xs text-slate-500"></p>
      </div>

      <form id="formNote" class="hidden space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Objet de la note *</label>
          <input type="text" id="noteObjet" required maxlength="200" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Structures destinataires * <span class="normal-case font-normal text-slate-500">(Ctrl/Cmd + clic pour en choisir plusieurs)</span></label>
          <select id="noteStructures" multiple required class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm min-h-28"></select>
        </div>
        <button type="submit" class="px-4 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-lg shadow">Transmettre à la secrétaire</button>
      </form>

      <div>
        <h3 class="text-sm font-bold text-slate-900 mb-3">Suivi des notes <span id="compteur" class="text-xs font-bold text-slate-500"></span></h3>
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left">
            <thead class="bg-slate-100 text-slate-700 font-bold uppercase">
              <tr><th class="px-4 py-2">Référence</th><th class="px-4 py-2">Objet</th><th class="px-4 py-2">Émetteur</th><th class="px-4 py-2">Destinataires</th><th class="px-4 py-2">État</th><th class="px-4 py-2">Action</th></tr>
            </thead>
            <tbody id="tableNotes" class="divide-y divide-slate-200"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    const user = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
    const codes = user.roles_codes || [];
    const peutEmettre = codes.some(c => ['ROLE_SOUS_DIRECTEUR', 'ROLE_DIRECTEUR', 'ROLE_DRH', 'ROLE_DIRECTEUR_CABINET'].includes(c));
    const peutDiffuser = codes.includes('ROLE_SECRETAIRE');

    // Vue propre à chaque profil : secrétaire (saisie), émetteurs (rédaction), chef de service (réception).
    const VUES = {
      SECRETAIRE: { role: 'Secrétaire', onglet: 'Suivi des notes de service', titre: 'Saisie et diffusion des notes de service', description: 'Saisissez les notes reçues puis transmettez-les aux destinataires (Directeurs, Sous-Directeurs, Chefs de service, agents) : notification et email.' },
      DIRCAB: { role: 'Directeur de Cabinet', onglet: 'Notes de service — Directeur de Cabinet', titre: 'Émission et suivi des notes de service', description: 'Rédigez l’objet de la note et transmettez-la à votre secrétaire, qui la saisit et la transmet aux destinataires.' },
      CHEF_SERVICE: { role: 'Chef de Service', onglet: 'Notes de service reçues', titre: 'Notes de service reçues', description: 'Vous recevez les notes transmises par la secrétaire. Le chef de service ne fait pas de demandes.' },
    };
    const vue = VUES[user.role] || { role: user.role || '', onglet: 'Notes de service', titre: 'Notes de service', description: 'Notes de service de votre périmètre.' };
    document.getElementById('roleLabel').textContent = vue.role;
    document.getElementById('onglet').textContent = vue.onglet;
    document.getElementById('titre').textContent = vue.titre;
    document.getElementById('description').textContent = vue.description;
    document.getElementById('formNote').classList.toggle('hidden', !peutEmettre);

    const ETATS = {
      BROUILLON: ['Brouillon', 'text-slate-700'], EN_ATTENTE_SAISIE: ['En attente de saisie', 'text-amber-700'],
      EN_ATTENTE_VALIDATION: ['En attente de validation', 'text-amber-700'], VALIDEE: ['Validée', 'text-emerald-700'],
      DIFFUSEE: ['Diffusée', 'text-emerald-700'], ARCHIVEE: ['Archivée', 'text-slate-500'], REFUSEE: ['Refusée', 'text-red-700'],
    };

    async function charger() {
      const res = await API.getNotes();
      const notes = res.status === 'success' ? res.notes : [];
      document.getElementById('compteur').textContent = '(' + notes.length + ')';
      document.getElementById('tableNotes').innerHTML = notes.map(n => {
        const [libelle, couleur] = ETATS[n.statut] || [n.statut || 'Diffusée', 'text-emerald-700'];
        const action = peutDiffuser && ['EN_ATTENTE_SAISIE', 'EN_ATTENTE_VALIDATION', 'VALIDEE'].includes(n.statut)
          ? `<button onclick="diffuser(${Number(n.id)})" class="px-2 py-1 bg-emerald-700 hover:bg-emerald-800 text-white rounded font-bold">Saisir et transmettre</button>` : '—';
        return `<tr>
          <td class="px-4 py-3 font-mono font-bold">${escapeHtml(n.numero || n.id)}</td>
          <td class="px-4 py-3 font-bold">${escapeHtml(n.libelle)}</td>
          <td class="px-4 py-3">${escapeHtml(n.emetteur)}</td>
          <td class="px-4 py-3">${escapeHtml(n.service)}</td>
          <td class="px-4 py-3 font-bold ${couleur}">${escapeHtml(libelle)}</td>
          <td class="px-4 py-3">${action}</td></tr>`;
      }).join('') || '<tr><td colspan="6" class="px-4 py-6 text-center text-slate-500 italic">Aucune note pour le moment.</td></tr>';
    }

    async function chargerStructures() {
      if (!peutEmettre) return;
      const res = await API.getStructures();
      const structures = (res.structures || []).slice().sort((a, b) => a.nom_structure.localeCompare(b.nom_structure, 'fr'));
      document.getElementById('noteStructures').innerHTML = structures.map(s => `<option value="${Number(s.id_structure)}">${escapeHtml(s.nom_structure)}</option>`).join('');
    }

    document.getElementById('formNote').onsubmit = async (e) => {
      e.preventDefault();
      const ids = Array.from(document.getElementById('noteStructures').selectedOptions).map(o => Number(o.value));
      const res = await API.publishNote(document.getElementById('noteObjet').value.trim(), ids);
      if (res.status === 'success') {
        alert('Note transmise à la secrétaire sous la référence ' + res.ref + '.');
        e.target.reset();
        charger();
      } else {
        alert(res.message || 'La note n’a pas pu être enregistrée.');
      }
    };

    async function diffuser(id) {
      const res = await API.diffuseNote(id);
      if (res.status === 'success') {
        alert('Note saisie et transmise aux destinataires (notification et email).');
        charger();
        if (window.rafraichirNotifications) window.rafraichirNotifications();
      } else {
        alert(res.message || 'La diffusion a échoué.');
      }
    }

    charger();
    chargerStructures();
  </script>
</body>
</html>
